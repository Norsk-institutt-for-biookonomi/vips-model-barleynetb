name=Barley Net Blotch Model
description=The prognosis model creates a growth curve for barley net blotch based on weather data. Some data must be submitted, like sowing date and variety. Additional data may to be submitted, for instance observations of the disease in the field, and if fungicides av been applied.\n\nThe disease curve is compared to a threshold value, that also grows every day. If the observed or calculated disease value is greater than the threshold value, a red sign indicates that the use of fungicides should be considered. The threshold value is an expression of the economic profitability of applying fungicides, and is based on spraying costs and costs from crop losses.\n
warningStatusInterpretation=The prognosis is presented both in a chart and in a table. On the chart, the disease value and threshold value are displayed. Values after the white dotted line are based on weather forecasts. The background color of the chart reflects the warning status. The table contains the values from the chart, and then some weather data for more detailed information.
