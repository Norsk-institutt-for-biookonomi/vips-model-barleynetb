name=Byggbrunflekkmodell
description={{filename="/images/barleynetblotch.jpg" description="Photo: E. Fl&oslash;istad, NIBIO"}}\n<h3>Beskrivelse</h3>\n<p>Varslingsmodellen lager en tilvekstkurve for byggbrunflekk med meteorologiske data som grunnlag og det er n&oslash;dvendig &aring; legge inn data for angrep av sjukdommen for at varselet skal beregnes (telle opp hvor mange blad av 100 som har byggbrunflekk). Dessuten tar modellen hensyn til s&aring;dato, sort, vekstskifte og jordarbeiding. For hver dag &oslash;ker sjukdommen noe, avhengig av nedb&oslash;rsmengde og - hyppighet.</p>\n<p>Varslingsmodellen blir hver dag sammenliknet med en terskelverdi som ogs&aring; vokser fra dag til dag. Dersom den observerte eller varslede sjukdomsverdien er st&oslash;rre enn terskelverdien, blir det gitt varsel om at spr&oslash;yting med et soppmiddel b&oslash;r vurderes. Terskelverdien gir et uttrykk for om det &oslash;konomisk vil l&oslash;nne seg &aring; spr&oslash;yte og er beregnet p&aring; grunnlag av avlingstap pga. sjukdom og gjennomsnittlige spr&oslash;ytekostnader.</p>\n<h3>Tolking av varsel</h3>\n<p>Varslene vises som diagram og som tabell. Svart linje viser beregnet sjukdomsverdi og r&oslash;d linje viser &oslash;konomisk skadeterskel. Prikkede linjer er beregnet etter v&aelig;rprognoser. N&aring;r den svarte linjen krysser den r&oslash;de og blir liggende over denne, b&oslash;r behandling med soppmiddel vurderes. I tabellen som ligger nedenfor diagrammet er det samme framstilt p&aring; en annen m&aring;te. Gr&oslash;nne ruter viser at forventet angrep er mindre enn terskel. N&aring;r ruta er r&oslash;d b&oslash;r spr&oslash;yting med soppmiddel vurderes.</p>\n<p>Tabellen med detaljerte varsler har disse kolonneoverskrifter med f&oslash;lgende betydning:</p>\n<ul>\n<li>Dato og tid: - Dag og tidspunkt</li>\n<li>Antall angr.bl.: - Antall sjuke blad av 100, beregnet verdi</li>\n<li>Terske antall angr. blad: - Beregnet terskelverdi som antall sjuke blad av 100</li>\n<li>%Angr. Bladareal: - Beregnet sjukdomsangrep som % bladareal</li>\n<li>Terskel, %angr. bladareal: - Terskel beregnet som % bladareal</li>\n<li>Status: - Varselsymbol for infeksjonsfare</li>\n</ul>
